# Person 3 — cold-chain data platform.
#   docker compose up -d --build      the whole pipeline
#   docker compose up -d backend      just the API (broker, db, redis come with it)
name: coldchain

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${PGUSER:-coldchain}
      POSTGRES_PASSWORD: ${PGPASSWORD:-coldchain}
      POSTGRES_DB: ${PGDATABASE:-coldchain}
    # Exposed on 5434 (5432 and 5433 are used by other services on this host).
    # Connect from host tools (pgAdmin, psql, DBeaver):
    #   host=localhost  port=5434  user=coldchain  password=coldchain  db=coldchain
    ports: ["5434:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-coldchain} -d ${PGDATABASE:-coldchain}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      # Infrastructure — always uses internal Docker hostnames, not localhost
      CC_MQTT_HOST: mosquitto
      CC_DATABASE_URL: postgresql+psycopg://${PGUSER:-coldchain}:${PGPASSWORD:-coldchain}@timescaledb:5432/${PGDATABASE:-coldchain}
      CC_REDIS_URL: redis://redis:6379/0
      CC_TIMESCALE_ENABLED: "true"
      CC_CORS_ORIGINS: "${CC_CORS_ORIGINS:-*}"
      # Intelligence engine
      CC_INTELLIGENCE_ENABLED: "${CC_INTELLIGENCE_ENABLED:-true}"
      CC_INTELLIGENCE_INTERVAL_S: "${CC_INTELLIGENCE_INTERVAL_S:-5}"
      CC_INTELLIGENCE_TELEMETRY_WINDOW: "${CC_INTELLIGENCE_TELEMETRY_WINDOW:-120}"
      # LLM — all three vars forwarded so MODE A / MODE B switch works
      CC_LLM_BASE_URL: "${CC_LLM_BASE_URL:-https://openrouter.ai/api/v1}"
      CC_LLM_MODEL: "${CC_LLM_MODEL:-deepseek/deepseek-v4.1-flash}"
      CC_LLM_TIMEOUT_S: "${CC_LLM_TIMEOUT_S:-30}"
      CC_LLM_MAX_TOKENS: "${CC_LLM_MAX_TOKENS:-512}"
      CC_LLM_PROBABILITY_BAND: "${CC_LLM_PROBABILITY_BAND:-0.35}"
      # Laya (local System 1 decision engine) — optional, corroborates only
      CC_LAYA_ENABLED: "${CC_LAYA_ENABLED:-true}"
      CC_LAYA_URL: "http://laya:8000"
      CC_LAYA_MODEL: "${CC_LAYA_MODEL:-router}"
      # API key — used for OpenRouter; set to any non-empty string for local LAYLA
      OPENROUTERAPIKEY: "${OPENROUTERAPIKEY:-}"
    depends_on:
      mosquitto: {condition: service_started}
      timescaledb: {condition: service_healthy}
      redis: {condition: service_healthy}
      laya: {condition: service_started}

  simulator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python sensor-simulator/simulator.py --broker mosquitto --interval 3
    environment:
      CC_MQTT_HOST: mosquitto
      CC_READING_INTERVAL_S: "${CC_READING_INTERVAL_S:-3}"
    depends_on:
      mosquitto: {condition: service_started}

  laya:
    build:
      context: ./laya
      dockerfile: Dockerfile
    # Internal HTTP (backend -> http://laya:8000); 8100 on the host for
    # `make laya-pull` and manual poking.
    ports: ["8100:8000"]
    volumes:
      - laya_models:/models
    environment:
      # Cap inference threads: many concurrent CPU forward passes oversubscribe
      # the machine (we measured 835% CPU and request timeouts without this).
      LAYA_THREADS: "${LAYA_THREADS:-4}"
      # English-only halves memory and build cost; multilingual stays available
      # by overriding LAYA_MODELS=english,multilingual.
      LAYA_MODELS: "${LAYA_MODELS:-english}"
      LAYA_PRELOAD: "1"
      LAYA_DEVICE: "cpu"
    healthcheck:
      # Cheap liveness probe; needs no model forward pass.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 8s
      retries: 40
      start_period: 300s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports: ["5173:5173"]
    environment:
      # Inside the compose network the backend is reachable by service name.
      VITE_API_PROXY: "http://backend:8000"
      VITE_USE_MOCKS: "false"
    depends_on:
      backend: {condition: service_started}

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    ports: ["5174:5174"]
    environment:
      VITE_API_PROXY: "http://backend:8000"
    depends_on:
      backend: {condition: service_started}

volumes:
  db_data:
  laya_models:

# Person 3 — cold-chain data platform.
#   docker compose up -d --build      the whole pipeline
#   docker compose up -d backend      just the API (broker, db, redis come with it)
name: coldchain

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: coldchain
      POSTGRES_PASSWORD: coldchain
      POSTGRES_DB: coldchain
    ports: ["5432:5432"]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldchain -d coldchain"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      CC_MQTT_HOST: mosquitto
      CC_DATABASE_URL: postgresql+psycopg://coldchain:coldchain@timescaledb:5432/coldchain
      CC_REDIS_URL: redis://redis:6379/0
      CC_TIMESCALE_ENABLED: "true"
      CC_INTELLIGENCE_ENABLED: "${CC_INTELLIGENCE_ENABLED:-true}"
      CC_INTELLIGENCE_INTERVAL_S: "${CC_INTELLIGENCE_INTERVAL_S:-5}"
      CC_LLM_MODEL: "${CC_LLM_MODEL:-openrouter/free}"
      CC_LLM_TIMEOUT_S: "${CC_LLM_TIMEOUT_S:-20}"
      OPENROUTERAPIKEY: "${OPENROUTERAPIKEY:-}"
    depends_on:
      mosquitto: {condition: service_started}
      timescaledb: {condition: service_healthy}
      redis: {condition: service_healthy}

  simulator:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python sensor-simulator/simulator.py --broker mosquitto --interval 3
    environment:
      CC_MQTT_HOST: mosquitto
      CC_READING_INTERVAL_S: "3"
    depends_on:
      mosquitto: {condition: service_started}

volumes:
  db_data: